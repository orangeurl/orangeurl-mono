services:
  caddy:
    image: caddy:2-alpine
    container_name: orangeurl-caddy
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-orangeurl.live}
      ACME_EMAIL: ${ACME_EMAIL:-admin@orangeurl.live}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.orangeurl.live}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.orangeurl.live}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: orangeurl-web
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=${BACKEND_URL:-http://api:3000/api/v1}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.orangeurl.live}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.orangeurl.live}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - DODO_PAYMENTS_API_KEY=${DODO_PAYMENTS_API_KEY:-}
      - DODO_PAYMENTS_ENVIRONMENT=${DODO_PAYMENTS_ENVIRONMENT:-test_mode}
      - DODO_PREMIUM_MONTHLY_PRODUCT_ID=${DODO_PREMIUM_MONTHLY_PRODUCT_ID:-}
      - DODO_PREMIUM_ANNUAL_PRODUCT_ID=${DODO_PREMIUM_ANNUAL_PRODUCT_ID:-}
      - DODO_PRO_MONTHLY_PRODUCT_ID=${DODO_PRO_MONTHLY_PRODUCT_ID:-}
      - DODO_PRO_ANNUAL_PRODUCT_ID=${DODO_PRO_ANNUAL_PRODUCT_ID:-}
    expose:
      - "3000"
    restart: unless-stopped

  api:
    build:
      context: ../backend/api
      dockerfile: Dockerfile
    container_name: orangeurl-api
    env_file:
      - .env
    environment:
      - APP_PORT=${APP_PORT:-:3000}
      - PUBLIC_HOST=${PUBLIC_HOST:-api.orangeurl.live}
      - DOMAIN=${PUBLIC_DOMAIN:-https://orangeurl.live}
      - API_QUOTA=${API_QUOTA:-100}
      - DB_ADDR=${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      - DB_PASS=${REDIS_PASSWORD}
      - POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-/app/geo-data}
    volumes:
      - ../backend/geo-data:/app/geo-data:ro
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: orangeurl-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orangeurl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orangeurl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orangeurl}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: orangeurl-redis
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  caddy-data:
  caddy-config:
