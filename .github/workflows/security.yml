name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action posts a PR comment on findings; needs write on pulls.
  pull-requests: write

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the whole diff range, not just
          # the latest commit. Without this PRs with multiple commits would
          # miss earlier introductions of secrets.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Path is resolved relative to the repo root.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the job on any finding so the PR is blocked until resolved.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
